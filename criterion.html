    <article class="content-card">
      <div class="evidence-title-row">
        <div>
          <span class="eyebrow-small">شواهد البند</span>
          <h2>المرفقات والشواهد</h2>
        </div>
      </div>
      <div id="criterionAttachments" class="criterion-attachments"></div>

</main>

<footer><span>❧</span><p>التعليم ليس فقط نقل معرفة… بل هو صناعة أثر يبقى مدى الحياة</p><span>❧</span></footer>

<script src="data.js?v=20261002-2"></script><script>
(function(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('preview')==='1'){
      const raw=sessionStorage.getItem('PORTFOLIO_PREVIEW_DATA');
      if(raw) window.PORTFOLIO_DATA=JSON.parse(raw);
      document.documentElement.classList.add('preview-mode');
    }
  }catch(e){}
})();
</script>
<script>
const params=new URLSearchParams(location.search);
const id=params.get('id');
const fallbackCriteria=[
{id:'duties',title:'أداء الواجبات الوظيفية',description:'الالتزام بالمسؤوليات والمهام المهنية بكفاءة وانتظام.',attachments:[]},
{id:'community',title:'التفاعل مع المجتمع المحلي',description:'مشاركة فاعلة في المبادرات والأنشطة ذات الصلة بالمجتمع.',attachments:[]},
{id:'parents',title:'التعامل مع أولياء الأمور',description:'تواصل مهني داعم لبناء شراكة فعالة مع أولياء الأمور.',attachments:[]},
{id:'strategies',title:'التنويع في استراتيجيات التدريس',description:'تنويع طرائق واستراتيجيات التعليم وفق احتياجات الطالبات.',attachments:[]},
{id:'results',title:'تحسين نتائج المتعلمين',description:'توظيف خطط علاجية وإثرائية لتحسين التحصيل.',attachments:[]},
{id:'plan',title:'إعداد وتنفيذ خطة التعلم',description:'تخطيط منظم للتعلم يربط الأهداف بالأنشطة والتقويم.',attachments:[]},
{id:'technology',title:'توظيف تقنيات ووسائل التعلم المناسبة',description:'استخدام التقنية والوسائل التعليمية لدعم التعلم.',attachments:[]},
{id:'environment',title:'تهيئة البيئة التعليمية',description:'تهيئة بيئة صفية منظمة ومحفزة وآمنة.',attachments:[]},
{id:'management',title:'الإدارة الصفية',description:'إدارة فعالة للحصة والوقت والتفاعل الصفي.',attachments:[]},
{id:'analysis',title:'تحليل نتائج المتعلمين وتشخيص مستوياتهم',description:'تحليل النتائج لتحديد نقاط القوة والاحتياج.',attachments:[]},
{id:'assessment',title:'تنوع أساليب التقويم',description:'استخدام أدوات تقويم متنوعة قبل التعلم وأثناءه وبعده.',attachments:[]}
];
const loaded=(window.PORTFOLIO_DATA&&window.PORTFOLIO_DATA.criteria)||[];
const all=Array.isArray(loaded)&&loaded.length?loaded:fallbackCriteria;
const item=all.find(x=>String(x.id)===String(id)) || all[Number(id)] || all[0];

const title=document.getElementById('criterionTitle');
const desc=document.getElementById('criterionDescription');
const body=document.getElementById('criterionBody');
const box=document.getElementById('criterionAttachments');
const quick=document.getElementById('quickAddCriterion');

if(item){
  title.textContent=item.title||'بند الأداء';
  desc.textContent=item.description||'';
  body.textContent=item.description||'';
  document.title=(item.title||'بند الأداء')+' | ملف الإنجاز الإلكتروني';
  const atts=Array.isArray(item.attachments)?item.attachments:[];
  if(!atts.length){
    box.innerHTML='<div class="empty-criterion-evidence">لا توجد شواهد مضافة لهذا البند حتى الآن.</div>';
  }else{
    atts.forEach((a,i)=>{
      const card=document.createElement('a');
      card.className='attachment-card';
      if(a.data){card.href=a.data;card.download=a.fileName||a.label||'مرفق';}else{card.href=a.url||'#';card.target='_blank';card.rel='noopener';}
      card.innerHTML=`<span class="attachment-icon">📎</span><div><strong></strong><small>فتح المرفق</small></div>`;
      card.querySelector('strong').textContent=a.label||('مرفق '+(i+1));
      box.appendChild(card);
    });
  }
}
const menu=document.getElementById('menuBtn'),nav=document.getElementById('nav');
if(menu&&nav) menu.onclick=()=>nav.classList.toggle('open');
</script>
</body>
</html>
