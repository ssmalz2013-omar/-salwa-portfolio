<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المشروعات التعليمية الرقمية</title>
<link rel="stylesheet" href="styles.css">
<style>
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.project{background:#fffaf8;border:1px solid #e6d4d8;border-radius:20px;padding:28px;text-align:center}
.project h2{font-size:22px;color:#775766}
.project a{display:inline-block;background:#775766;color:white;padding:12px 25px;border-radius:30px;text-decoration:none}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html">ملف الإنجاز الإلكتروني</a>
<nav><a href="index.html">الرئيسية</a></nav>
</header>
<main class="inner-page">
<section class="page-hero">
<h1>المشروعات التعليمية الرقمية</h1>
<p>مواقع ومشروعات رقمية لدعم التعلم وتعزيز تفاعل الطالبات</p>
</section>
<section class="projects" id="projects"></section>
<div class="page-back"><a href="index.html">العودة إلى الرئيسية</a></div>
</main>
<script>
fetch('data.js?v='+Date.now(),{cache:'no-store'})
.then(r=>{if(!r.ok)throw Error();return r.text()})
.then(source=>{
const script=document.createElement('script');
script.textContent=source;
document.head.appendChild(script);
const card=(window.PORTFOLIO_DATA.homeCards||[])
.find(c=>c.id==='card-1792860746433');
const box=document.getElementById('projects');
(card?.attachments||[]).forEach(item=>{
let url;
try{url=new URL(item.url);if(!['https:','http:'].includes(url.protocol))return}catch(e){return}
const article=document.createElement('article');
article.className='project';
const title=document.createElement('h2');
title.textContent=item.label;
const link=document.createElement('a');
link.textContent='زيارة الموقع';
link.href=url.href;
link.target='_blank';
link.rel='noopener noreferrer';
article.append(title,link);
box.appendChild(article);
});
})
.catch(()=>document.getElementById('projects').textContent='تعذر تحميل الروابط. أعيدي تحديث الصفحة.');
</script>
</body>
</html>
